<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Z Assistant">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Z Assistant</title>
<style>
@font-face{font-family:"Unbounded";src:url(fonts/unbounded.woff2) format("woff2");font-weight:200 900;font-display:swap}
@font-face{font-family:"Manrope";src:url(fonts/manrope.woff2) format("woff2");font-weight:200 800;font-display:swap}
/* Layout idea: true black, one glowing reactor orb as the hero, everything else is quiet glass that reacts to touch. Single dark world by choice. */
:root{
  color-scheme:dark;
  --bg:#000000; --ink:#F4F8FB; --muted:#8B97A5; --line:rgba(255,255,255,.11); --glass:rgba(255,255,255,.055);
  --glow:#5FE1FF; --glow2:#A99BFF; --must:#FF6F6F; --should:#FFC65C; --ok:#4FE3A1;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:500 16px/1.45 var(--body);-webkit-text-size-adjust:100%;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(60% 34% at 50% 0%,rgba(95,225,255,.13),transparent 70%),radial-gradient(40% 24% at 88% 12%,rgba(169,155,255,.09),transparent 70%)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.app{position:relative;height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}

.glass{background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.025));border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 10px 30px rgba(0,0,0,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) 6px calc(18px + env(safe-area-inset-left))}
.brand{font:700 15px/1 var(--display);letter-spacing:.01em;background:linear-gradient(100deg,#fff 20%,var(--glow) 60%,var(--glow2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px;padding:8px 10px;margin:-8px -10px;border-radius:10px}
.sync:active{transform:scale(.94)}
.bk{display:flex;flex-direction:column;gap:10px}
.bk p{margin:0;color:var(--muted);font-size:14px}
.bk h3{font:700 18px/1.2 var(--display);margin:0}
.bk .btn{width:100%}
.bk textarea{min-height:90px;font-size:13px}
.ver{font-size:12px;color:var(--muted);text-align:center}
.bk label.btn{display:block;color:var(--ink);font:700 15px/1.45 var(--body);text-align:center;margin:0;cursor:pointer}
.sync b{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync[data-s="ok"] b{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.sync[data-s="slow"] b,.sync[data-s="local"] b{background:var(--should)}

main{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 16px 24px;display:flex;flex-direction:column;gap:20px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
main>*{flex:none}
main.swap>*{animation:rise .42s var(--ease) both}
main.swap>*:nth-child(2){animation-delay:.05s}main.swap>*:nth-child(3){animation-delay:.1s}main.swap>*:nth-child(n+4){animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
h1{font:700 24px/1.12 var(--display);letter-spacing:-.01em;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin:6px 0 0}
h2{font:600 13px/1 var(--body);color:var(--muted);margin:0 2px 10px;display:flex;justify-content:space-between;gap:8px}

/* reactor orb */
.hero{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:4px}
.hello{align-self:stretch}
.orb{position:relative;width:186px;height:186px;margin:2px 0 0;border-radius:50%;display:grid;place-items:center}
.orb::before{content:"";position:absolute;inset:14px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 62%,rgba(95,225,255,.55),rgba(169,155,255,.4),transparent 96%);filter:blur(16px);animation:spin 9s linear infinite}
.orb::after{content:"";position:absolute;inset:26px;border-radius:50%;background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.22),rgba(255,255,255,.03) 38%,rgba(0,0,0,.9) 72%),#04080b;box-shadow:inset 0 0 26px rgba(95,225,255,.22),inset 0 1px 0 rgba(255,255,255,.3)}
.orb svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 0 9px rgba(95,225,255,.75))}
.orb .trk{fill:none;stroke:rgba(255,255,255,.08);stroke-width:5}
.orb .arc{fill:none;stroke:url(#g);stroke-width:5;stroke-linecap:round;stroke-dasharray:540.4;transition:stroke-dashoffset .9s var(--ease)}
.orb .in{position:relative;z-index:1;text-align:center}
.orb .big{font:700 36px/1 var(--display);font-variant-numeric:tabular-nums;text-shadow:0 0 22px rgba(95,225,255,.6)}
.orb .big.sm{font-size:26px}
.orb .lab{font-size:13px;color:var(--muted);margin-top:6px}
.orb.run::before{animation-duration:3s}
@keyframes spin{to{transform:rotate(360deg)}}

/* now card */
.now{position:relative;overflow:hidden;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:16px}
.now::after{content:"";position:absolute;top:0;bottom:0;width:45%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.13),transparent);transform:skewX(-18deg);animation:sheen 5.5s ease-in-out infinite;pointer-events:none}
@keyframes sheen{0%,62%{left:-60%}100%{left:130%}}
.now .k{font-size:13px;font-weight:600;color:var(--glow);display:flex;justify-content:space-between}
.now .t{font:700 22px/1.2 var(--display);letter-spacing:-.01em;overflow-wrap:anywhere;text-wrap:balance;display:block;width:100%}
.now .go{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.now.empty .t{font-size:18px}.now.empty p{margin:0;color:var(--muted);font-size:14px}
.btn{font-weight:700;font-size:15px;padding:13px 14px;border-radius:14px;border:1px solid var(--line);text-align:center;background:rgba(255,255,255,.05);transition:transform .15s var(--ease),box-shadow .2s}
.btn:active,.chip:active,.pin:active,.tri button:active,nav a:active{transform:scale(.94)}
.btn.shine{grid-column:1/-1;color:#00161d;border:0;background:linear-gradient(180deg,#fff,#c9f5ff 45%,var(--glow));box-shadow:inset 0 1px 0 #fff,0 0 28px rgba(95,225,255,.5),0 8px 22px rgba(95,225,255,.22);font-size:16px;padding:15px}
.btn.del{color:var(--must)}

/* rows */
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.row{position:relative;border-radius:16px}
.under{position:absolute;inset:0;border-radius:16px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-weight:700;font-size:14px;opacity:0}
.row[data-dir="r"] .under{opacity:1;background:linear-gradient(90deg,rgba(79,227,161,.32),transparent 70%);color:var(--ok)}
.row[data-dir="l"] .under{opacity:1;background:linear-gradient(270deg,rgba(255,198,92,.3),transparent 70%);color:var(--should)}
.row[data-dir="r"] .under span:last-child,.row[data-dir="l"] .under span:first-child{visibility:hidden}
.card{position:relative;display:flex;align-items:center;gap:12px;padding:13px 12px 13px 14px;border-radius:16px;touch-action:pan-y;transition:transform .3s var(--ease),opacity .3s;background:linear-gradient(180deg,#15181b,#0a0c0e);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.card.col{flex-direction:column;align-items:stretch;gap:10px}
.chk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.35);transition:all .2s var(--ease);display:grid;place-items:center}
.p1 .chk{border-color:var(--must);box-shadow:0 0 10px rgba(255,111,111,.4)} .p2 .chk{border-color:var(--should)}
.isdone .chk{background:var(--ok);border-color:var(--ok);box-shadow:0 0 12px rgba(79,227,161,.55)}
.isdone .chk::after{content:"";width:9px;height:5px;border:solid #00160d;border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translate(1px,-1px)}
.isdone .t{text-decoration:line-through;color:var(--muted)}
.body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.t{overflow-wrap:anywhere;font-weight:600}
.m{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.m .late,.m .p1{color:var(--must)} .m .p2{color:var(--should)}
.pin{flex:none;font-size:12px;font-weight:700;padding:8px 10px;border:1px solid var(--line);border-radius:10px;color:var(--muted);transition:all .2s var(--ease)}
.pin.on{color:#00161d;background:linear-gradient(180deg,#fff,var(--glow));border-color:transparent;box-shadow:0 0 16px rgba(95,225,255,.45)}
.tri{display:flex;gap:6px;flex-wrap:wrap}
.tri button{font-size:13px;font-weight:600;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.05);transition:transform .15s var(--ease)}
.hint{color:var(--muted);font-size:14px;padding:16px;border-radius:16px;border:1px dashed var(--line);margin:0}
.swipetip{font-size:12.5px;color:var(--muted);text-align:center;margin:-8px 0 0}
.nudge{display:flex;justify-content:space-between;align-items:center;gap:12px;border-radius:16px;padding:14px 16px;font-size:14px;color:inherit;text-decoration:none}
.nudge b{color:var(--glow);white-space:nowrap}
.search{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.05)}
.idea{display:block;width:100%;padding:14px;border-radius:16px}
.idea .n{color:var(--muted);font-size:14px;margin-top:3px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.link{font-size:13px;font-weight:600;color:var(--muted);text-decoration:underline;text-underline-offset:3px}

/* dock */
.dock{padding:8px calc(12px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:8px;background:linear-gradient(180deg,transparent,#000 30%)}
.cap{border-radius:20px;padding:8px;display:flex;flex-direction:column;gap:8px;transition:box-shadow .25s,border-color .25s}
.cap:focus-within{border-color:rgba(95,225,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 0 4px rgba(95,225,255,.1),0 0 34px rgba(95,225,255,.22)}
.cap form{display:flex;gap:8px}
.cap input{flex:1;min-width:0;padding:11px 10px;border:0;background:none;outline:none}
.cap input::placeholder{color:var(--muted)}
.add{flex:none;width:46px;height:46px;border-radius:14px;color:#00161d;font:700 24px/1 var(--body);text-align:center;background:linear-gradient(180deg,#fff,var(--glow));box-shadow:inset 0 1px 0 #fff,0 0 20px rgba(95,225,255,.45);transition:transform .15s var(--ease)}
.add:active{transform:scale(.88) rotate(90deg)}
.chips,.seg{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;font-weight:600;padding:7px 12px;border:1px solid var(--line);border-radius:99px;color:var(--muted);transition:all .2s var(--ease)}
.chip[aria-pressed="true"]{color:var(--ink);border-color:rgba(95,225,255,.6);background:rgba(95,225,255,.14);box-shadow:0 0 14px rgba(95,225,255,.2)}
nav{display:flex;border-radius:20px;padding:5px}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 7px;border-radius:15px;color:var(--muted);text-decoration:none;font-size:11.5px;font-weight:700;transition:all .25s var(--ease);position:relative}
nav a svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav a[aria-current="page"]{color:var(--ink);background:rgba(255,255,255,.09);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
nav a[aria-current="page"] svg{stroke:var(--glow);filter:drop-shadow(0 0 6px var(--glow))}
nav a i{position:absolute;top:4px;right:22%;font:700 10px/16px var(--body);min-width:16px;height:16px;border-radius:8px;background:var(--must);color:#200;text-align:center;padding:0 4px}
nav a i:empty{display:none}

/* sheet + toast */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;z-index:5;animation:fade .2s}
.veil[hidden],.toast[hidden]{display:none}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:26px 26px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px;background:linear-gradient(180deg,#16191c,#060708);border:1px solid var(--line);border-bottom:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 -20px 60px rgba(95,225,255,.12);animation:up .38s var(--ease)}
@keyframes up{from{transform:translateY(100%)}}
.sheet label,.sheet .lab{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:7px}
.sheet textarea,.sheet input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.05);resize:vertical}
.sheet textarea:focus,.sheet input:focus{outline:none;border-color:rgba(95,225,255,.6)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.acts .shine{grid-column:auto;padding:13px 24px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(178px + env(safe-area-inset-bottom));z-index:6;padding:11px 16px;border-radius:14px;font-size:14px;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);background:#14181b;border:1px solid rgba(95,225,255,.35);box-shadow:0 0 30px rgba(95,225,255,.2);animation:pop .3s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(12px) scale(.96)}}
.toast button{font-weight:700;color:var(--glow);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* v2: account, reminders, lists, steps */
#auth{position:fixed;inset:0;z-index:8;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));overflow-y:auto}
#auth[hidden]{display:none}
#auth::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(55% 32% at 50% 18%,rgba(95,225,255,.18),transparent 70%),radial-gradient(40% 24% at 85% 10%,rgba(169,155,255,.12),transparent 70%)}
.aw{position:relative;width:100%;max-width:400px;display:flex;flex-direction:column;gap:18px}
.aw .mark{width:86px;height:86px;border-radius:50%;margin:0 auto;display:grid;place-items:center;font:800 40px/1 var(--display);color:#fff;text-shadow:0 0 22px rgba(95,225,255,.9);background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.2),rgba(255,255,255,.03) 40%,#04080b 75%);box-shadow:0 0 0 3px rgba(95,225,255,.75),0 0 34px rgba(95,225,255,.55),inset 0 0 24px rgba(95,225,255,.25)}
.aw h1{text-align:center;font-size:22px;line-height:1.2}
.aw .sub{text-align:center;margin-top:8px}
.af{border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.af label{font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.af input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.05);font-size:16px}
.af input:focus{outline:none;border-color:rgba(95,225,255,.6);box-shadow:0 0 0 4px rgba(95,225,255,.1)}
.af .btn{width:100%}
.amsg{font-size:14px;color:var(--should);min-height:0}
.amsg:empty{display:none}
.alinks{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.alinks button{font-size:14px;font-weight:600;color:var(--glow)}
.anote{font-size:12.5px;color:var(--muted);text-align:center;margin:0}
.lists{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px}
.lists::-webkit-scrollbar{display:none}
.lists .chip{flex:none}
.m .ls{color:var(--glow2)}
.m .rm{color:var(--glow)}
.steps{display:flex;flex-direction:column;gap:6px}
.step{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:12px;background:rgba(255,255,255,.04)}
.step .chk{width:22px;height:22px}
.step.isdone .chk{background:var(--ok);border-color:var(--ok)}
.step.isdone span{text-decoration:line-through;color:var(--muted)}
.step span{flex:1;min-width:0;overflow-wrap:anywhere;font-size:14.5px}
.step .x{color:var(--muted);font-size:20px;line-height:1;padding:2px 6px}
.isdone.step .chk::after{content:"";width:8px;height:4px;border:solid #00160d;border-width:0 0 2px 2px;transform:rotate(-45deg) translate(1px,-1px)}
.addstep{display:flex;gap:8px}
.addstep input{flex:1}
.rline{font-size:14px;color:var(--glow);margin:8px 0 0}
.rline.off{color:var(--muted)}
.snz{border-radius:16px;padding:12px;border:1px solid rgba(95,225,255,.35);background:rgba(95,225,255,.08);display:flex;flex-direction:column;gap:8px}
.snz b{font-size:14px}
.set{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.set:first-child{border-top:0;padding-top:0}
.set h3{font:700 16px/1.2 var(--display);margin:0}
.set p{margin:0;color:var(--muted);font-size:14px}
.set .row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.set .row2 input{flex:1;min-width:140px}
.planbar{display:flex;flex-direction:column;gap:10px}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="app">
  <header class="top">
    <div class="brand">Z Assistant</div>
    <button class="sync" id="sync" type="button" data-s="ok" aria-label="Account and settings"><b></b><span id="syncText">Saved on this phone</span></button>
  </header>
  <main id="main"></main>
  <div class="dock">
    <div class="cap glass">
      <form id="capForm" autocomplete="off">
        <input id="capText" type="text" placeholder="Call Ali tomorrow 5pm #clients" aria-label="Capture a task or idea" enterkeyhint="done">
        <button class="add" type="submit" aria-label="Add">+</button>
      </form>
      <div class="chips">
        <button class="chip" type="button" id="kTask" aria-pressed="true">Task</button>
        <button class="chip" type="button" id="kIdea" aria-pressed="false">Idea</button>
        <button class="chip" type="button" id="kToday" aria-pressed="false">Due today</button>
      </div>
    </div>
    <nav class="glass" aria-label="Sections">
      <a href="#today" data-v="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3"/></svg>Today</a>
      <a href="#inbox" data-v="inbox"><svg viewBox="0 0 24 24"><path d="M3.5 13.5 6 5h12l2.5 8.5V19h-17z"/><path d="M3.5 13.5h5l1 2.5h5l1-2.5h5"/></svg>Inbox<i id="nInbox"></i></a>
      <a href="#plan" data-v="plan"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>Plan</a>
      <a href="#ideas" data-v="ideas"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M8.5 14.5a6 6 0 1 1 7 0c-.6.5-1 1.2-1 2H9.5c0-.8-.4-1.5-1-2z"/></svg>Ideas</a>
    </nav>
  </div>
</div>
<div id="auth" hidden></div>
<div class="veil" id="veil" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Edit"></div></div>
<div class="toast" id="toast" hidden role="status"><span id="toastText"></span><button type="button" id="toastBtn"></button></div>
<script src="config.js"></script>
<script src="lib/supabase.js"></script>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};

var today=function(){return ymd(new Date())};
var addDays=function(n){var d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
var nowHM=function(){var d=new Date();return z(d.getHours())+':'+z(d.getMinutes())};
var PRI={1:'Must',2:'Should',3:'Later'}, MAX=3, CIRC=540.4, FOCUS_MS=25*60000, VERSION='2.0';
var REPEAT={'':'No repeat',daily:'Daily',weekdays:'Weekdays',weekly:'Weekly',monthly:'Monthly'};
var calm=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

function hmOf(ms){var d=new Date(ms);return z(d.getHours())+':'+z(d.getMinutes())}
function fmtTime(hm){var p=hm.split(':'),h=+p[0];return ((h+11)%12+1)+':'+p[1]+(h<12?' AM':' PM')}
function dayWord(dstr){
  var t=today(),d=Math.round((new Date(dstr+'T12:00')-new Date(t+'T12:00'))/864e5);
  if(d===0)return 'Today';if(d===1)return 'Tomorrow';if(d===-1)return 'Yesterday';

}
function fmtWhen(ms){return dayWord(ymd(new Date(ms)))+' '+fmtTime(hmOf(ms))}

/* ---------- cloud ---------- */
var CFG=window.Z_CONFIG||{};
var sb=null;
try{if(CFG.url&&CFG.key&&window.supabase)sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'zassistant.auth'}})}catch(e){sb=null}
var CLOUD=!!sb, FN=CLOUD?CFG.url+'/functions/v1/remind':'';
var user=null, settings={name:'',daily_at:'',tz:''};
var items=new Map(), dirty={}, seq=0, since='', flushing=false, flushT=0, chan=null, online=navigator.onLine;
var V1='zassistant.items.v1';
function key(n){return 'zassistant.u.'+(user?user.id:'local')+'.'+n}
function loadCache(){
  items=new Map();
  var list=CLOUD?lsGet(key('items'),[]):lsGet(V1,[]);
  list.forEach(function(i){if(i&&i.id)items.set(i.id,i)});
  dirty=CLOUD?lsGet(key('dirty'),{}):{};since=CLOUD?lsGet(key('since'),''):'';
  if(CLOUD)settings=Object.assign({name:'',daily_at:'',tz:''},lsGet(key('settings'),{}));
  else settings=Object.assign({name:'',daily_at:'',tz:''},lsGet('zassistant.local.settings',{}));
}
function saveCache(){
  var ok=CLOUD?lsSet(key('items'),Array.from(items.values()))&&lsSet(key('dirty'),dirty)&&lsSet(key('since'),since):lsSet(V1,Array.from(items.values()));
  if(!ok)toast('Phone storage is full. Clear finished tasks in Plan.');
  status();
}
function put(it){it.updated=Date.now();items.set(it.id,it);dirty[it.id]=++seq;saveCache();render();flushSoon()}
function del(id){items.delete(id);dirty[id]='del'+(++seq);saveCache();render();flushSoon()}
function flushSoon(){clearTimeout(flushT);flushT=setTimeout(flush,500)}
async function flush(){
  if(!CLOUD||!user||flushing)return;
  var ids=Object.keys(dirty);if(!ids.length){status();return}
  if(!navigator.onLine){status();return}
  flushing=true;status();
  var snap={};ids.forEach(function(id){snap[id]=dirty[id]});
  var rows=ids.map(function(id){
    var it=items.get(id);
    if(!it||String(dirty[id]).indexOf('del')===0)return {user_id:user.id,id:id,data:{},remind_at:null,deleted:true};
    var body={};Object.keys(it).forEach(function(k){if(k!=='_l')body[k]=it[k]});
    return {user_id:user.id,id:id,data:body,remind_at:it.remindAt&&!it.done?new Date(it.remindAt).toISOString():null,deleted:false};
  });
  try{
    var r=await sb.from('items').upsert(rows,{onConflict:'user_id,id'});
    if(r.error)throw r.error;
    ids.forEach(function(id){if(dirty[id]===snap[id])delete dirty[id]});
    saveCache();
  }catch(e){
    console.warn('sync',e);
    setTimeout(flush,15000);
  }
  flushing=false;status();
  if(Object.keys(dirty).length)flushSoon();
}
function mergeRow(r){
  if(!r||!r.id||dirty[r.id]!==undefined)return false;
  if(r.deleted){return items.delete(r.id)}
  var d=Object.assign({},r.data||{},{id:r.id});
  var cur=items.get(r.id);
  if(cur&&JSON.stringify(cur)===JSON.stringify(d))return false;
  items.set(r.id,d);return true;
}
async function pull(){
  if(!CLOUD||!user||!navigator.onLine)return;
  try{
    var changed=false,more=true;
    while(more){
      var q=sb.from('items').select('id,data,deleted,updated_at').order('updated_at',{ascending:true}).limit(1000);
      if(since)q=q.gte('updated_at',since);
      var r=await q;if(r.error)throw r.error;
      r.data.forEach(function(row){if(mergeRow(row))changed=true});
      if(r.data.length)since=r.data[r.data.length-1].updated_at;
      more=r.data.length===1000;
    }
    saveCache();if(changed&&!sw&&$('#veil').hidden)render();
  }catch(e){console.warn('pull',e)}
  status();
}
function live(){
  if(chan){try{sb.removeChannel(chan)}catch(e){}chan=null}
  chan=sb.channel('items-'+user.id).on('postgres_changes',{event:'*',schema:'public',table:'items',filter:'user_id=eq.'+user.id},function(p){
    if(p.new&&mergeRow(p.new)){if(p.new.updated_at>since)since=p.new.updated_at;saveCache();if(!sw&&$('#veil').hidden)render()}
  }).subscribe();
}
async function loadSettings(){
  try{
    var r=await sb.from('settings').select('name,daily_at,tz').maybeSingle();
    if(r.error)throw r.error;
    if(r.data){settings=Object.assign(settings,r.data);lsSet(key('settings'),settings)}
    var metaName=user.user_metadata&&user.user_metadata.name;
    if(!settings.name&&metaName){settings.name=metaName;saveSettings()}
    else if(!r.data){saveSettings()}
    render();
  }catch(e){console.warn('settings',e)}
}
async function saveSettings(){
  settings.tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC';
  if(!CLOUD){lsSet('zassistant.local.settings',settings);render();return}
  lsSet(key('settings'),settings);render();
  try{var r=await sb.from('settings').upsert({user_id:user.id,name:settings.name||null,daily_at:settings.daily_at||null,tz:settings.tz});if(r.error)throw r.error}
  catch(e){toast('Could not save settings. Check your internet and try again.')}
}
function status(){
  var el=$('#sync'),t=$('#syncText'),n=Object.keys(dirty).length;
  if(!CLOUD){el.dataset.s='ok';t.textContent='Saved on this phone';return}
  if(!user){el.dataset.s='slow';t.textContent='Signed out';return}
  if(!navigator.onLine){el.dataset.s='slow';t.textContent=n?'Offline, '+n+' to sync':'Offline';return}
  if(flushing||n){el.dataset.s='wait';t.textContent='Syncing';return}
  el.dataset.s='ok';t.textContent='Synced';
}
async function startUser(u){
  if(user&&user.id===u.id){return}
  user=u;loadCache();
  if(!lsGet('zassistant.v1moved.'+u.id,false)){
    var old=lsGet(V1,[]);
    old.forEach(function(i){if(i&&i.id&&!items.has(i.id)){items.set(i.id,i);dirty[i.id]=++seq}});
    lsSet('zassistant.v1moved.'+u.id,true);saveCache();
  }
  $('#auth').hidden=true;route();
  live();pull().then(flush);loadSettings();prefetchVapid();
}
function stopUser(){
  if(chan){try{sb.removeChannel(chan)}catch(e){}chan=null}
  user=null;items=new Map();dirty={};render();showAuth('in');
}

function authErr(e){
  var m=String(e&&e.message||e||'');
  if(/invalid login/i.test(m))return 'Wrong email or password.';
  if(/already registered|already exists/i.test(m))return 'That email already has an account. Sign in instead.';
  if(/password.*(6|short|least)/i.test(m))return 'Use at least 6 characters for the password.';
  if(/valid email|invalid.*email|email.*invalid/i.test(m))return 'Enter a valid email address.';
  if(/rate|too many|security purposes/i.test(m))return 'Too many tries. Wait a minute and try again.';
  if(/fetch|network/i.test(m))return 'No internet connection. Connect and try again.';
  return m||'Something went wrong. Try again.';
}
$('#auth').addEventListener('click',function(e){var b=e.target.closest('[data-m]');if(b)showAuth(b.dataset.m)});

/* ---------- model ---------- */
function all(){return Array.from(items.values())}
function tasks(){return all().filter(function(i){return i.kind==='task'&&!i.done})}
function byPlan(a,b){return (a.pri||9)-(b.pri||9)||String(a.due||'9').localeCompare(String(b.due||'9'))||String(a.time||'99').localeCompare(String(b.time||'99'))||a.created-b.created}
function isLate(i){var t=today();return !!i.due&&(i.due<t||(i.due===t&&!!i.time&&i.time<nowHM()))}
function allLists(){var s={};all().forEach(function(i){if(i.list)s[i.list]=1});return Object.keys(s).sort(function(a,b){return a.localeCompare(b)})}
function dueLabel(i){
  if(!i.due)return '';
  var t=today(),d=Math.round((new Date(i.due+'T12:00')-new Date(t+'T12:00'))/864e5),s;
  if(d<0)s=(-d)+(d===-1?' day late':' days late');else s=dayWord(i.due);
  return s+(i.time?' '+fmtTime(i.time):'');
}
function meta(i){
  var h='',d=dueLabel(i);
  if(d)h+='<span class="'+(isLate(i)?'late':'')+'">'+esc(d)+'</span>';
  if(i.pri)h+='<span class="p'+i.pri+'">'+PRI[i.pri]+'</span>';
  if(i.remindAt&&!i.done&&i.remindAt>Date.now())h+='<span class="rm">Reminder '+esc(fmtWhen(i.remindAt))+'</span>';
  if(i.repeat)h+='<span>'+REPEAT[i.repeat]+'</span>';
  if(i.steps&&i.steps.length){var dn=i.steps.filter(function(s){return s.d}).length;h+='<span>'+dn+'/'+i.steps.length+' steps</span>'}
  if(i.list)h+='<span class="ls">#'+esc(i.list)+'</span>';
  if(i.focus&&i.focus<today()&&!i.done)h+='<span class="late">Carried over</span>';
  return h?'<span class="m">'+h+'</span>':'';
}
function focusList(){var t=today();return tasks().filter(function(i){return i.focus===t}).sort(function(a,b){return (a.focusAt||0)-(b.focusAt||0)})}
function doneToday(){var t=today();return all().filter(function(i){return i.kind==='task'&&(i.done&&i.doneAt&&ymd(new Date(i.doneAt))===t||i.repeat&&i.lastDone&&ymd(new Date(i.lastDone))===t&&!i.done)})}
function toggleFocus(i){
  var t=today();
  if(i.focus===t){i.focus='';put(i);return}
  if(focusList().length>=MAX){buzz([20,40,20]);toast('Top 3 is full. Finish one or swap one out.');return}
  i.focus=t;i.focusAt=Date.now();buzz(12);put(i);
}
function nextDate(base,rep){
  var d=new Date(base+'T12:00'),t=today(),day=d.getDate(),guard=0;
  do{
    if(rep==='daily')d.setDate(d.getDate()+1);
    else if(rep==='weekdays'){do{d.setDate(d.getDate()+1)}while(d.getDay()===0||d.getDay()===6)}
    else if(rep==='weekly')d.setDate(d.getDate()+7);
    else if(rep==='monthly'){var m=d.getMonth()+1;d.setDate(1);d.setMonth(m);var last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last))}
    guard++;
  }while(ymd(d)<=t&&guard<400);
  return ymd(d);
}
function finish(i,x,y){
  if(F&&F.id===i.id)stopFocus();
  burst(x,y);buzz([15,30,40]);
  if(i.repeat){
    var before=JSON.parse(JSON.stringify(i));
    var nd=nextDate(i.due||today(),i.repeat);
    if(i.remindAt)i.remindAt=at(nd,hmOf(i.remindAt));
    i.due=nd;i.focus='';i.lastDone=Date.now();
    if(i.steps)i.steps.forEach(function(s){s.d=false});
    put(i);
    toast('Done. Next one '+dayWord(nd)+'.','Undo',function(){items.set(i.id,before);put(before)});
    return;
  }
  i.done=true;i.doneAt=Date.now();put(i);
  toast('Done.','Undo',function(){i.done=false;i.doneAt=0;put(i)});
}
function tomorrow(i){
  var was={due:i.due,focus:i.focus,remindAt:i.remindAt};i.due=addDays(1);i.focus='';
  if(i.remindAt)i.remindAt=at(i.due,hmOf(i.remindAt));
  put(i);toast('Moved to tomorrow.','Undo',function(){i.due=was.due;i.focus=was.focus;i.remindAt=was.remindAt;put(i)});
}

/* ---------- smart capture ---------- */
var WD=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
function parse(raw,kind){
  var t=' '+raw+' ',o={list:'',pri:0,due:'',time:'',remindAt:0};
  t=t.replace(/\s#([\w-]{1,30})(?=\s)/,function(m,l){o.list=l.toLowerCase();return ' '});
  if(kind!=='task'){o.text=t.trim().replace(/\s+/g,' ');return o}
  t=t.replace(/\s!([123])?(?=\s)/,function(m,n){o.pri=n?+n:1;return ' '});
  var tm=null;
  t=t.replace(/\s(?:at\s+)?(\d{1,2})(?::(\d{2}))?\s?(am|pm)(?=\s)/i,function(m,h,mi,ap){
    h=+h;mi=mi?+mi:0;if(h<1||h>12||mi>59)return m;
    if(/pm/i.test(ap)&&h<12)h+=12;if(/am/i.test(ap)&&h===12)h=0;tm=z(h)+':'+z(mi);return ' ';
  });
  if(!tm)t=t.replace(/\sat\s+(\d{1,2}):(\d{2})(?=\s)/i,function(m,h,mi){if(+h>23||+mi>59)return m;tm=z(+h)+':'+mi;return ' '});
  var day='';
  t=t.replace(/\s(today|tonight|tomorrow|tmrw|tmr)(?=\s)/i,function(m,w){
    w=w.toLowerCase();if(w==='today')day=today();else if(w==='tonight'){day=today();if(!tm){var nh=new Date().getHours()+1;tm=nh<20?'20:00':(nh<24?z(nh)+':00':'23:30')}}else day=addDays(1);return ' ';
  });
  if(!day)t=t.replace(/\s(?:on\s+|next\s+)?(sunday|monday|tuesday|wednesday|thursday|friday|saturday)(?=\s)/i,function(m,w){
    var target=WD.indexOf(w.toLowerCase()),d=new Date(),diff=(target-d.getDay()+7)%7||7;day=addDays(diff);return ' ';
  });
  if(tm&&!day)day=(tm>nowHM())?today():addDays(1);
  if(day){o.due=day;if(tm){o.time=tm;o.remindAt=at(day,tm)}}
  o.text=t.trim().replace(/\s+/g,' ');
  if(!o.text)o.text=raw.trim();
  return o;
}

/* ---------- focus timer ---------- */
var F=lsGet('zassistant.focus.v1',null);
function saveF(){lsSet('zassistant.focus.v1',F)}
function startFocus(id){F={id:id,end:Date.now()+FOCUS_MS};saveF();buzz(20);render()}
function stopFocus(){F=null;saveF()}
function orbState(){
  if(F&&items.has(F.id)&&!items.get(F.id).done){
    var left=Math.max(0,F.end-Date.now()),s=Math.ceil(left/1000);
    return {p:left/FOCUS_MS,big:z(Math.floor(s/60))+':'+z(s%60),lab:'Focus time left',sm:true,run:true};
  }
  var n=focusList().length,d=doneToday().length;
  if(n)return {p:d/(d+n),big:String(n),lab:n===1?'thing left today':'things left today'};
  if(d)return {p:1,big:String(d),lab:'done today. All clear'};
  return {p:0,big:'0',lab:'Pick your top 3'};
}
function paintOrb(){
  var o=orbState(),a=$('#orbArc');if(!a)return;
  a.style.strokeDashoffset=CIRC*(1-o.p);
  var b=$('#orbBig');b.textContent=o.big;b.className='big'+(o.sm?' sm':'');
  $('#orbLab').textContent=o.lab;$('#orb').classList.toggle('run',!!o.run);

setInterval(function(){
  if(!F)return;
  if(Date.now()>=F.end){var it=items.get(F.id);stopFocus();buzz([200,100,200,100,300]);render();toast('25 minutes done. Finished'+(it?' "'+it.text.slice(0,28)+'"':'')+'?');}
  else if(view==='today')paintOrb();

/* ---------- particles ---------- */
var cv=$('#fx'),cx=cv.getContext('2d'),ps=[],raf=0;
function burst(x,y){
  if(calm||x==null)return;
  var r=window.devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;cx.setTransform(r,0,0,r,0,0);
  for(var i=0;i<34;i++){var a=Math.random()*6.283,v=2+Math.random()*7;ps.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,l:1,s:1.5+Math.random()*2.5,c:['#5FE1FF','#FFFFFF','#A99BFF','#4FE3A1'][i%4]})}
  if(!raf)raf=requestAnimationFrame(step);
}
function step(){
  cx.clearRect(0,0,innerWidth,innerHeight);cx.globalCompositeOperation='lighter';
  ps=ps.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.22;p.vx*=.97;p.l-=.022;if(p.l<=0)return false;
    cx.globalAlpha=p.l;cx.fillStyle=p.c;cx.shadowColor=p.c;cx.shadowBlur=12;cx.beginPath();cx.arc(p.x,p.y,p.s,0,6.283);cx.fill();return true});
  raf=ps.length?requestAnimationFrame(step):0;if(!raf)cx.clearRect(0,0,innerWidth,innerHeight);

/* ---------- views ---------- */

function vPlan(){

function vIdeas(){

  var s=q.trim().toLowerCase(),l=s?a.filter(function(i){return (i.text+' '+(i.note||'')+' '+(i.list||'')).toLowerCase().indexOf(s)>-1}):a;

    return '<li><button class="idea glass" data-id="'+esc(i.id)+'" data-act="edit"><span class="t">'+esc(i.text)+'</span>'+(i.note?'<div class="n">'+esc(i.note)+'</div>':'')+
      '<span class="m" style="margin-top:5px"><span>'+new Date(i.created).toLocaleDateString(undefined,{month:'short',day:'numeric'})+'</span>'+(i.list?'<span class="ls">#'+esc(i.list)+'</span>':'')+'</span></button></li>';

function render(){
  var m=$('#main'),ae=document.activeElement,keep=ae&&ae.id&&m.contains(ae)?{id:ae.id,s:ae.selectionStart}:null,st=m.scrollTop;
  m.innerHTML=({today:vToday,inbox:vInbox,plan:vPlan,ideas:vIdeas}[view])();
  m.scrollTop=st;
  if(keep){var el=document.getElementById(keep.id);if(el){el.focus();try{el.setSelectionRange(keep.s,keep.s)}catch(e){}}}
  document.querySelectorAll('nav a').forEach(function(a){if(a.dataset.v===view)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  var n=tasks().filter(function(i){return !i.pri&&!i.due&&!i.focus}).length;$('#nInbox').textContent=n||'';

function route(){
  var v=location.hash.slice(1);
  if(v.indexOf('task-')===0){
    var id=v.slice(5);view='today';history.replaceState(null,'',location.pathname+location.search+'#today');
    render();if(items.has(id))openSheet(id,true);return;
  }
  view=({today:1,inbox:1,plan:1,ideas:1}[v])?v:'today';
  setKind(view==='ideas'?'idea':'task');var m=$('#main');m.scrollTop=0;render();
  m.classList.remove('swap');void m.offsetWidth;m.classList.add('swap');

/* ---------- capture ---------- */
var capKind='task',capToday=false;
function setKind(k){capKind=k;$('#kTask').setAttribute('aria-pressed',k==='task');$('#kIdea').setAttribute('aria-pressed',k==='idea');$('#kToday').hidden=k==='idea';$('#capText').placeholder=k==='idea'?'Reel idea: night drone over Charminar #hyd':'Call Ali tomorrow 5pm #clients'}
$('#kTask').onclick=function(){setKind('task')};
$('#kIdea').onclick=function(){setKind('idea')};
$('#kToday').onclick=function(){capToday=!capToday;this.setAttribute('aria-pressed',capToday)};
$('#capForm').addEventListener('submit',function(e){
  e.preventDefault();

  var p=parse(raw,capKind);
  var it={id:uid(),kind:capKind,text:p.text,note:'',pri:p.pri,due:p.due||((capKind==='task'&&capToday)?today():''),time:p.time,focus:'',focusAt:0,done:false,doneAt:0,created:Date.now(),list:p.list,steps:[],repeat:'',remindAt:p.remindAt};
  inp.value='';buzz(10);put(it);

  toast((capKind==='idea'?'Saved to Ideas':(it.due||it.pri?'Saved':'Saved to Inbox'))+(bits.length?': '+bits.join(', '):'')+'.','Edit',function(){openSheet(it.id)});

/* ---------- swipe ---------- */
var sw=null,block=false,M=$('#main');
M.addEventListener('pointerdown',function(e){
  var c=e.target.closest('.card.sw');if(!c)return;
  sw={c:c,row:c.parentNode,x:e.clientX,y:e.clientY,dx:0,on:false};
});
M.addEventListener('pointermove',function(e){
  if(!sw)return;var dx=e.clientX-sw.x,dy=e.clientY-sw.y;
  if(!sw.on){
    if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.5){sw.on=true;sw.c.style.transition='none'}
    else{if(Math.abs(dy)>14)sw=null;return}
  }
  sw.dx=dx;sw.c.style.transform='translateX('+dx+'px)';sw.row.dataset.dir=dx>0?'r':'l';
});
function endSwipe(e){
  if(!sw)return;var s=sw;sw=null;if(!s.on)return;
  block=true;setTimeout(function(){block=false},60);
  var it=items.get(s.row.dataset.id);s.c.style.transition='';
  if(it&&Math.abs(s.dx)>96){
    s.c.style.transform='translateX('+(s.dx>0?110:-110)+'%)';s.c.style.opacity='0';
    setTimeout(function(){if(s.dx>0)finish(it,e.clientX,e.clientY);else{buzz(12);tomorrow(it)}},190);
  }else{s.c.style.transform='';delete s.row.dataset.dir}
}
M.addEventListener('pointerup',endSwipe);M.addEventListener('pointercancel',endSwipe);

/* ---------- actions ---------- */
var clearArmed=0;
M.addEventListener('click',function(e){
  if(block)return;
  var b=e.target.closest('[data-act]');if(!b)return;
  var act=b.dataset.act;
  if(act==='plist'){plist=b.dataset.l;render();return}
  if(act==='clear'){
    if(Date.now()-clearArmed<4000){all().filter(function(i){return i.kind==='task'&&i.done}).forEach(function(i){del(i.id)});clearArmed=0;toast('Finished tasks cleared.')}
    else{clearArmed=Date.now();b.textContent='Tap again to clear '+b.dataset.n+' for good'}
    return;
  }
  var host=b.closest('[data-id]'),it=host?items.get(host.dataset.id):null;
  if(!it)return;
  var r=b.getBoundingClientRect();
  if(act==='done')finish(it,r.left+r.width/2,r.top+r.height/2);
  else if(act==='undo'){it.done=false;it.doneAt=0;put(it)}
  else if(act==='edit')openSheet(it.id);
  else if(act==='focus')toggleFocus(it);
  else if(act==='skip'){if(F&&F.id===it.id)stopFocus();it.focusAt=Date.now();put(it)}
  else if(act==='startfocus')startFocus(it.id);
  else if(act==='stopfocus'){stopFocus();render()}
  else if(act==='pri'){it.pri=+b.dataset.p;buzz(10);put(it)}
  else if(act==='today'){it.due=today();buzz(10);put(it)}
  else if(act==='toidea'){it.kind='idea';it.remindAt=0;put(it);toast('Moved to Ideas.')}
});
M.addEventListener('input',function(e){
  if(e.target.id==='ideaSearch'){q=e.target.value;render()}
  else if(e.target.id==='planSearch'){pq=e.target.value;render()}
});

/* ---------- edit sheet ---------- */
var draft=null,delArmed=false,sheetMode='';
function chip(g,v,l){return '<button type="button" class="chip" data-g="'+g+'" data-v="'+esc(v)+'" aria-pressed="'+(String(draft[g]||'')===String(v))+'">'+l+'</button>'}
function remindChips(){
  var h=new Date().getHours(),c='';
  c+='<button type="button" class="chip" data-r="60">In 1 hour</button>';
  if(h<19)c+='<button type="button" class="chip" data-r="tonight">Tonight 8 PM</button>';
  c+='<button type="button" class="chip" data-r="tom9">Tomorrow 9 AM</button>';
  if(draft.due&&draft.time)c+='<button type="button" class="chip" data-r="due">At due time</button>';
  c+='<button type="button" class="chip" data-r="off">No reminder</button>';

}
function remindLine(){
  if(!draft.remindAt)return '<p class="rline off" id="rLine">No reminder set.</p>';
  var past=draft.remindAt<=Date.now();
  return '<p class="rline'+(past?' off':'')+'" id="rLine">'+(past?'Reminded you ':'Reminds you ')+esc(fmtWhen(draft.remindAt))+'.'+(pushState()==='on'||past?'':' Turn on notifications in Settings so your phone can buzz.')+'</p>';
}
function stepsHtml(){
  return (draft.steps||[]).map(function(s,n){return '<div class="step'+(s.d?' isdone':'')+'"><button type="button" class="chk" data-s="'+n+'" aria-label="'+(s.d?'Mark step not done':'Mark step done')+'"></button><span>'+esc(s.t)+'</span><button type="button" class="x" data-sx="'+n+'" aria-label="Remove step">&times;</button></div>'}).join('');
}
function listChips(){
  var ls=allLists();if(draft.list&&ls.indexOf(draft.list)<0)ls.push(draft.list);

}
function openSheet(id,fromNote){

    (past||fromNote?'<div class="snz"><b>Snooze this reminder</b><div class="seg"><button type="button" class="chip" data-snz="10">10 minutes</button><button type="button" class="chip" data-snz="60">1 hour</button><button type="button" class="chip" data-snz="tom9">Tomorrow 9 AM</button></div></div>':'')+

function remindFrom(code){

  if(sheetMode!=='edit'||!draft)return;
  if(e.target.id==='fRemind'){var v=e.target.value;setRemind(v?new Date(v).getTime():0);if(draft.remindAt)nudgePush()}
  if(e.target.id==='fDue'||e.target.id==='fTime'){draft.due=$('#fDue').value;draft.time=$('#fTime').value;$('#rChips').innerHTML=remindChips()}
});
$('#veil').addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  if(e.target.id==='fStep'){e.preventDefault();addStep()}
  if(e.target.id==='fList'){e.preventDefault();addList()}
});

/* ---------- notifications ---------- */
var vapidKey=lsGet('zassistant.vapid','');
function isIOS(){return /iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)}
function standalone(){return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true}
function pushSupported(){return 'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window}
var pushOn=lsGet('zassistant.pushon',false);
function pushState(){
  if(!CLOUD)return 'nocloud';
  if(isIOS()&&!standalone())return 'install';
  if(!pushSupported())return 'unsupported';
  if(Notification.permission==='denied')return 'denied';
  return pushOn&&Notification.permission==='granted'?'on':'off';
}
async function prefetchVapid(){
  if(!CLOUD||vapidKey)return;
  try{var r=await fetch(FN+'?vapid=1');var j=await r.json();if(j.publicKey){vapidKey=j.publicKey;lsSet('zassistant.vapid',vapidKey)}}catch(e){}
}
function b64u(s){var p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/')),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function enablePush(){
  var st=pushState();
  if(st==='install'){toast('On iPhone, add Z Assistant to your Home Screen first, then turn on notifications from the app.');return false}
  if(st==='unsupported'){toast('This browser cannot show notifications. Try Chrome on Android or the Home Screen app on iPhone.');return false}
  if(st==='denied'){toast('Notifications are blocked for Z Assistant. Allow them in your phone settings, then try again.');return false}
  var perm=await Notification.requestPermission();
  if(perm!=='granted'){toast('Notifications were not allowed.');return false}
  try{
    if(!vapidKey)await prefetchVapid();
    if(!vapidKey)throw new Error('no key');
    var reg=await navigator.serviceWorker.ready;
    var sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(vapidKey)});
    var r=await sb.from('push_subs').upsert({endpoint:sub.endpoint,user_id:user.id,sub:sub.toJSON(),tz:Intl.DateTimeFormat().resolvedOptions().timeZone});
    if(r.error)throw r.error;
    pushOn=true;lsSet('zassistant.pushon',true);toast('Notifications are on for this phone.');return true;
  }catch(e){console.warn(e);toast('Could not turn on notifications. Check your internet and try again.');return false}
}
async function testPush(){
  try{
    var reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();
    if(!sub){toast('Turn on notifications first.');return}
    var r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({test:sub.endpoint})});
    var j=await r.json();toast(j.sent?'Test sent. It should arrive in a few seconds.':(j.error||'Test did not send.'));
  }catch(e){toast('Could not send a test. Check your internet.')}
}
var nudged=false;
function nudgePush(){if(nudged||!CLOUD||pushState()==='on')return;nudged=true;setTimeout(function(){toast('To get reminders, turn on notifications.','Turn on',function(){openSettings()})},2600)}
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',function(e){
  if(e.data&&e.data.open){try{var h=new URL(e.data.open).hash;if(h){location.hash=h;route()}}catch(x){}}
});

/* ---------- settings sheet ---------- */
function backupText(){return JSON.stringify({app:'z-assistant',version:2,exported:new Date().toISOString(),items:all()})}
function openSettings(){
  draft=null;sheetMode='settings';var n=all().length,ps=pushState(),pending=Object.keys(dirty).length;
  var h='';
  h+='<div class="set"><h3>Your name</h3><div class="row2"><input id="sName" type="text" value="'+esc(settings.name||'')+'" placeholder="Your name" aria-label="Your name"><button type="button" class="btn" id="sNameSave">Save</button></div></div>';
  if(CLOUD&&user){
    h+='<div class="set"><h3>Account</h3><p>Signed in as '+esc(user.email||'')+'. '+n+' item'+(n===1?'':'s')+(pending?', '+pending+' waiting to sync':', all saved to your account')+'.</p>'+
      '<div class="row2"><button type="button" class="btn" id="sSync">Sync now</button><button type="button" class="btn del" id="sOut">Sign out</button></div></div>';
    var pmsg={on:'Notifications are on for this phone.',off:'Turn on notifications so reminders can buzz this phone, even when the app is closed.',install:'On iPhone, open Safari, tap Share, then Add to Home Screen. Open Z Assistant from the Home Screen icon and turn on notifications there.',denied:'Notifications are blocked. Allow them for Z Assistant in your phone settings.',unsupported:'This browser cannot show notifications. Use Chrome on Android, or the Home Screen app on iPhone.'}[ps];
    h+='<div class="set"><h3>Reminders</h3><p>'+pmsg+'</p><div class="row2">'+
      (ps==='off'?'<button type="button" class="btn shine" id="sPush">Turn on notifications</button>':'')+
      (ps==='on'?'<button type="button" class="btn" id="sTest">Send a test</button>':'')+'</div></div>';
    h+='<div class="set"><h3>Daily plan</h3><p>Get a nudge every morning to pick your top 3.</p><div class="row2"><input id="sDaily" type="time" aria-label="Daily plan time" value="'+esc(settings.daily_at||'')+'"><button type="button" class="btn" id="sDailySave">'+(settings.daily_at?'Update':'Turn on')+'</button>'+(settings.daily_at?'<button type="button" class="btn" id="sDailyOff">Turn off</button>':'')+'</div></div>';
  }else{
    h+='<div class="set"><h3>Saved on this phone</h3><p>Cloud sync is not set up yet, so your '+n+' item'+(n===1?' is':'s are')+' only on this phone. Save a backup now and then.</p></div>';
  }
  h+='<div class="set bk"><h3>Backup</h3><p>Download a copy of everything, or restore one.</p>'+
    '<button type="button" class="btn" id="bSave">Save backup file</button><button type="button" class="btn" id="bCopy">Copy backup as text</button>'+
    '<label class="btn" for="bFile">Restore from a file</label><input type="file" id="bFile" accept=".json,application/json,text/plain" hidden>'+
    '<textarea id="bPaste" placeholder="Or paste backup text here" aria-label="Paste backup text"></textarea><button type="button" class="btn" id="bPasteGo">Restore from pasted text</button></div>';
  h+='<div class="set"><p class="ver">Z Assistant '+VERSION+'</p><button type="button" class="btn" id="sClose">Close</button></div>';
  $('#sheet').innerHTML=h;$('#veil').hidden=false;prefetchVapid();
}
function restore(txt){
  var d;try{d=JSON.parse(txt)}catch(e){toast('That is not a Z Assistant backup.');return}
  var list=Array.isArray(d)?d:(d&&d.items);
  if(!Array.isArray(list)){toast('That is not a Z Assistant backup.');return}
  var c=0;list.forEach(function(i){if(i&&typeof i.id==='string'&&(i.kind==='task'||i.kind==='idea')&&typeof i.text==='string'){delete i._l;items.set(i.id,i);dirty[i.id]=++seq;c++}});
  saveCache();closeSheet();render();flushSoon();toast(c?'Restored '+c+' item'+(c===1?'':'s')+'.':'No items found in that backup.');
}
var outArmed=false;
$('#sync').onclick=function(){outArmed=false;openSettings()};
$('#sheet').addEventListener('click',async function(e){
  if(sheetMode!=='settings')return;
  var b=e.target.closest('button');if(!b)return;
  if(b.id==='sClose')closeSheet();
  else if(b.id==='sNameSave'){settings.name=$('#sName').value.trim();saveSettings();toast('Name saved.')}
  else if(b.id==='sSync'){await flush();await pull();toast(Object.keys(dirty).length?'Some changes are still waiting. Check your internet.':'Everything is synced.');openSettings()}
  else if(b.id==='sOut'){
    var pend=Object.keys(dirty).length;
    if(!outArmed){outArmed=true;b.textContent=pend?pend+' changes not synced. Tap again to sign out anyway':'Tap again to sign out';return}
    var id=user.id;['items','dirty','since','settings'].forEach(function(k){lsDel('zassistant.u.'+id+'.'+k)});
    lsDel('zassistant.pushon');pushOn=false;
    closeSheet();await sb.auth.signOut();stopUser();
  }
  else if(b.id==='sPush'){await enablePush();openSettings()}
  else if(b.id==='sTest')testPush();
  else if(b.id==='sDailySave'){var v=$('#sDaily').value||'09:00';settings.daily_at=v;await saveSettings();toast('Daily plan nudge set for '+fmtTime(v)+'.');if(pushState()!=='on')nudgePush();openSettings()}
  else if(b.id==='sDailyOff'){settings.daily_at='';await saveSettings();toast('Daily plan nudge turned off.');openSettings()}
  else if(b.id==='bCopy'){try{await navigator.clipboard.writeText(backupText());toast('Backup copied. Paste it somewhere safe.')}catch(x){toast('Copy did not work. Use Save backup file.')}}
  else if(b.id==='bPasteGo')restore($('#bPaste').value);
  else if(b.id==='bSave'){
    var name='z-assistant-backup-'+today()+'.json',blob=new Blob([backupText()],{type:'application/json'});
    try{var f=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Z Assistant backup'});return}}catch(x){if(x&&x.name==='AbortError')return}
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
  }
});
$('#sheet').addEventListener('change',function(e){
  if(e.target.id!=='bFile'||!e.target.files[0])return;
  var r=new FileReader();r.onload=function(){restore(String(r.result))};r.readAsText(e.target.files[0]);
});

/* ---------- toast ---------- */
var toastT=0,toastFn=null;
function toast(msg,label,fn){
  var t=$('#toast');$('#toastText').textContent=msg;var b=$('#toastBtn');b.textContent=label||'';b.hidden=!label;toastFn=fn||null;
  t.hidden=true;void t.offsetWidth;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},label?5500:3400);
}
$('#toastBtn').onclick=function(){$('#toast').hidden=true;if(toastFn)toastFn()};

/* ---------- boot ---------- */
window.addEventListener('hashchange',route);
window.addEventListener('online',function(){status();flush();pull()});
window.addEventListener('offline',status);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&user){pull();flush();if(view==='today'&&$('#veil').hidden)render()}});
setInterval(function(){
  var ae=document.activeElement;
  if(user&&!document.hidden)pull();
  if(view==='today'&&!sw&&$('#veil').hidden&&!(ae&&/INPUT|TEXTAREA/.test(ae.tagName)))render();
},60000);
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('sw.js').catch(function(){})}
if(!CLOUD){loadCache();route();status()}
else{
  status();
  sb.auth.onAuthStateChange(function(ev,session){
    if(ev==='PASSWORD_RECOVERY'){showAuth('reset');return}
    if(session&&session.user){if(authMode!=='reset'||$('#auth').hidden)startUser(session.user)}
    else if(ev==='SIGNED_OUT'){if(user)stopUser()}
  });
  sb.auth.getSession().then(function(r){
    var s=r.data&&r.data.session;
    if(s&&s.user){if(!(authMode==='reset'&&!$('#auth').hidden))startUser(s.user)}
    else if($('#auth').hidden&&!user)showAuth('in');
  }).catch(function(){showAuth('in')});
}
})();
</script>
</body>
